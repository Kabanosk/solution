# Push to main -> build and roll out only what changed. Manifests are applied only on a manual run.
# Freeze before a live demo: gh workflow disable deploy.yml
# Setup (secrets OPENSHIFT_SERVER, OPENSHIFT_TOKEN): deploy/openshift/ci/README.md
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        description: Build and roll out the backend
        type: boolean
        default: true
      dashboard:
        description: Build and roll out the dashboard
        type: boolean
        default: true
      manifests:
        description: Apply deploy/openshift/app and deploy/openshift/dashboard
        type: boolean
        default: false

concurrency:
  group: deploy-openshift
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: cfo-agent-uwur

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ inputs.backend || steps.filter.outputs.backend == 'true' }}
      dashboard: ${{ inputs.dashboard || steps.filter.outputs.dashboard == 'true' }}
      manifests: ${{ inputs.manifests || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Containerfile'
              - 'deploy/cfo-entrypoint.sh'
            dashboard:
              - 'dashboard/**'

  manifests:
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"

      - uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          certificate_authority_data: ${{ secrets.OPENSHIFT_CA }}
          namespace: ${{ env.NAMESPACE }}

      - run: oc apply -k deploy/openshift/app
      - run: oc apply -k deploy/openshift/dashboard

  backend:
    needs: [changes, manifests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"

      - uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.NAMESPACE }}
          certificate_authority_data: ${{ secrets.OPENSHIFT_CA }}

      # Image triggers roll out api, scout-worker, bank-mock, mcp-* and usage-sampler.
      - run: oc start-build cfo-backend --commit=${{ github.sha }} --follow --wait
      - run: oc rollout status deploy/api --timeout=600s
      - run: oc rollout status deploy/scout-worker --timeout=600s

  dashboard:
    needs: [changes, manifests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.dashboard == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4"

      - uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.NAMESPACE }}
          certificate_authority_data: ${{ secrets.OPENSHIFT_CA }}

      - run: python3 dashboard/scripts/package-source.py "$RUNNER_TEMP/dashboard.tar.gz"
      - run: oc start-build cfo-dashboard --from-archive="$RUNNER_TEMP/dashboard.tar.gz" --follow --wait
      # The Deployment is pinned by digest (no image trigger), so point it at the new image.
      - run: oc set image deployment/dashboard dashboard="$(oc get istag cfo-dashboard:latest -o jsonpath='{.image.dockerImageReference}')"
      - run: oc rollout status deployment/dashboard --timeout=300s
