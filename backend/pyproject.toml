[project]
name = "cfo"
version = "0.1.0"
description = "Autonomous CFO for Pizzeria Amalfi: backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "slack-bolt>=1.20",
    "mcp>=1.12,<2",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pandas>=2.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pypdf>=7.1.1",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.1",
    "httpx>=0.28.1",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    # notebooks/forecast.ipynb: build, validate and execute it locally
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfo", "scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
