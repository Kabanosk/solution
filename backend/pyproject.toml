[project]
name = "cfo"
version = "0.1.0"
description = "Autonomous CFO for Pizzeria Amalfi: backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "mcp>=1.12,<2",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
