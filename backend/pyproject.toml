[project]
name = "cfo"
version = "0.1.0"
description = "Autonomous CFO for Pizzeria Amalfi: backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "slack-bolt>=1.20",
    "mcp>=1.12,<2",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pandas>=2.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pypdf>=7.1.1",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.14"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
