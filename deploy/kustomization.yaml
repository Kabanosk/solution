apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [postgres.yaml, files.yaml, openshift/db, openshift/app, openshift/mlflow]
# Label objects and their pod templates, but never the selectors (they are immutable on live Deployments).
# `fields` instead of `includeTemplates` renders with kubectl's built-in kustomize (v4.5, kubectl 1.24) as well as v5.
labels:
  - pairs:
      app.kubernetes.io/part-of: cfo
    includeSelectors: false
    fields:
      - {path: spec/template/metadata/labels, create: true, kind: Deployment}
      - {path: spec/template/metadata/labels, create: true, kind: StatefulSet}
      - {path: spec/template/metadata/labels, create: true, kind: Job}
