apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/component: api}
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"cfo-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, app.kubernetes.io/component: api}}
    spec:
      enableServiceLinks: false  # Service `api` would inject API_PORT=tcp://... and break the entrypoint
      volumes:
        - name: llm-ca
          configMap: {name: llm-service-ca}
        - name: data
          persistentVolumeClaim: {claimName: cfo-data}
      containers:
        - name: api
          image: cfo-backend:latest
          args: [api]
          volumeMounts:
            - {name: llm-ca, mountPath: /etc/llm-ca, readOnly: true}
            - {name: data, mountPath: /app/data, readOnly: true}
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: cfo-config}
            - secretRef: {name: scout-onboarding, optional: true}  # server app credentials and stable CONNECTIONS_KEY only
            - secretRef: {name: slack, optional: true}   # SLACK_* for the Slack connection status (team Secret, not in git)
          env:
            # DATABASE_URL is composed from the keys of Secret `postgres` (see deploy/postgres.yaml);
            # $(VAR) is expanded by Kubernetes, so these three must stay above it. If the password
            # contains URL-special characters (@ : / ?) percent-encode it or pick an alphanumeric one.
            - {name: POSTGRESQL_USER, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_USER}}}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_PASSWORD}}}
            - {name: POSTGRESQL_DATABASE, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_DATABASE}}}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRESQL_USER):$(POSTGRESQL_PASSWORD)@postgres:5432/$(POSTGRESQL_DATABASE)
            # Bearer token of the NeMo check service (Secret scout-guardrails-client, key token, made by T051); optional:
            # without it Scout calls the service unauthenticated and, if that fails, fails open (D-029).
            - {name: GUARDRAILS_TOKEN, valueFrom: {secretKeyRef: {name: scout-guardrails-client, key: token, optional: true}}}
            # The liquidity model is trained on the first request when the file is missing; /tmp is writable under any UID.
            - {name: FORECAST_MODEL_PATH, value: /tmp/liquidity_xgb.json}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api
  labels: {app: api}
spec:
  to: {kind: Service, name: api}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
