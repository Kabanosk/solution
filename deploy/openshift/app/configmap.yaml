# Non-secret settings shared by api, scout-worker, bank-mock and the MCP servers (envFrom).
# After changing a value:  oc apply -k deploy/  &&  oc rollout restart deploy/api deploy/scout-worker
# (see README.md in this directory). Slack tokens live in Secret `slack` (created by the team), not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfo-config
data:
  # Model (D-017): Granite 4.0 H Tiny on vLLM, KServe InferenceService in namespace my-first-model (one L4 GPU),
  # plain HTTP on the headless predictor Service, container port 8080.
  # Swap model = change these two values. For the NeMo Guardrails proxy, point LLM_BASE_URL at the proxy.
  LLM_BASE_URL: "http://modelcar-granite-4-0-h-tiny-predictor.my-first-model.svc.cluster.local:8080/v1"
  LLM_MODEL: "modelcar-granite-4-0-h-tiny"
  # TLS check for an https endpoint: true | false | CA bundle path. The OpenShift service CA is injected into
  # ConfigMap llm-service-ca and mounted at /etc/llm-ca (use it for an https in-cluster model endpoint).
  LLM_VERIFY_TLS: "/etc/llm-ca/service-ca.crt"
  # MCP servers (streamable HTTP, endpoint /mcp).
  MCP_COMPANY_DB_URL: "http://mcp-company-db:8001/mcp"
  MCP_WORKSTATIONS_URL: "http://mcp-workstations:8002/mcp"
  MCP_HR_URL: "http://mcp-hr:8003/mcp"
  # Demo API destination only. Workers select the saved tenant bank; SCOUT_DEMO=0 never polls this mock.
  BANK_API_URL: "http://bank-mock:8010"
  SCOUT_WORKERS: "4"
  # Explicit legacy worker binding; startup still refuses until an operator enrolls the intended owner.
  SCOUT_ORGANIZATION_ID: "00000000-0000-4000-8000-000000000001"
  # Demo: Amalfi (the legacy organization) keeps its existing integrations (Slack, mail, files, bank mock, vLLM usage
  # sampler). Approved by the team on 2026-11-21. New organizations never get them (tenant_settings strips them).
  SCOUT_LEGACY_CONNECTORS_ORGANIZATION: "00000000-0000-4000-8000-000000000001"
  DATA_DIR: "/app/data/generated"
  WORKSTATIONS_ROOT: "/app/data/generated/workstations"
  DASHBOARD_URL: "https://dashboard-cfo-agent-uwur.apps.<cluster-domain>"  # task links; Slack icon at /scout-icon.png
  SCOUT_APP_ORIGIN: "https://dashboard-cfo-agent-uwur.apps.<cluster-domain>"
  GOOGLE_REDIRECT_URI: "https://api-cfo-agent-uwur.apps.<cluster-domain>/v1/connections/google/callback"
  SCOUT_DEMO: "0"  # demo/connection mutation endpoints remain closed under organization auth
  # CORS is not authorization; every data route independently verifies the session and membership.
  CORS_ORIGINS: "https://dashboard-cfo-agent-uwur.apps.<cluster-domain>"
  # MLflow tracking server (self-hosted, deploy/openshift/mlflow); in-cluster Service URL.
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  # Liquidity forecast model served by the API (the alias is re-read every 60 s). Any MLflow error, or an empty registry, falls
  # back to the local file (FORECAST_MODEL_PATH, trained on first use). Filled by the Jobs in deploy/openshift/forecast.
  FORECAST_MODEL_URI: "models:/liquidity-forecast@champion"
  # LLM usage and cost (T032): vLLM Prometheus metrics, scraped by Deployment usage-sampler.
  VLLM_METRICS_URL: "http://modelcar-granite-4-0-h-tiny-predictor.my-first-model.svc.cluster.local:8080/metrics"
  VLLM_METRICS_VERIFY: "/etc/llm-ca/service-ca.crt"
  # NeMo Guardrails check service (T051 CR `scout-guardrails`, D-029): Scout calls POST /v1/guardrail/checks at three points.
  # In-cluster https Service (443), verified with the OpenShift service CA (GUARDRAILS_CA, default
  # /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt). Empty = safety checks off. GUARDRAILS_TOKEN comes from
  # Secret scout-guardrails-client (key token), COMPLIANCE_CONTACT from Secret `slack` (docs/guardrails.md, "App wiring").
  GUARDRAILS_URL: "https://scout-guardrails.cfo-agent-uwur.svc.cluster.local"
