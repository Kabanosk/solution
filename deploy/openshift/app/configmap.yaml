# Non-secret settings shared by api, worker and the MCP servers (envFrom).
# After changing a value:  oc apply -k deploy/  &&  oc rollout restart deploy/api deploy/worker
# (see README.md in this directory). Secrets live in Secret `cfo-secrets`, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfo-config
data:
  # Model (D-017): Granite 4.0 H Tiny on vLLM, LLMInferenceService in namespace my-first-model (one L4 GPU).
  # Swap model = change these two values. For the NeMo Guardrails proxy, point LLM_BASE_URL at the proxy.
  LLM_BASE_URL: "https://modelcar-granite-4-0-h-tiny-kserve-workload-svc.my-first-model.svc:8000/v1"
  LLM_MODEL: "modelcar-granite-4-0-h-tiny"
  # The endpoint's cert is signed by the OpenShift service CA, injected into ConfigMap llm-service-ca
  # and mounted at /etc/llm-ca (api, worker). Values: true | false | path to a CA bundle.
  LLM_VERIFY_TLS: "/etc/llm-ca/service-ca.crt"
  # MCP servers (streamable HTTP, endpoint /mcp). Read by the worker (T011).
  MCP_COMPANY_DB_URL: "http://mcp-company-db:8001/mcp"
  MCP_WORKSTATIONS_URL: "http://mcp-workstations:8002/mcp"
  MCP_HR_URL: "http://mcp-hr:8003/mcp"
  # Simulator speed: 1 = real time, 3600 = one simulated hour per second (demo).
  SIM_SPEED: "1"
  # Browser origins allowed by the API; `*` until the dashboard has a fixed URL.
  CORS_ORIGINS: "*"
  # MLflow tracking server (self-hosted, deploy/openshift/mlflow); in-cluster Service URL.
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  # LLM usage and cost (T032): vLLM Prometheus metrics, scraped by Deployment usage-sampler.
  VLLM_METRICS_URL: "https://modelcar-granite-4-0-h-tiny-kserve-workload-svc.my-first-model.svc:8000/metrics"
  VLLM_METRICS_VERIFY: "/etc/llm-ca/service-ca.crt"
