# Scout's worker pool (`cfo worker` -> python -m scout.worker): bank/mail/chat watchers, the job queue
# (SCOUT_WORKERS threads) and the Slack Socket Mode client. It only makes outbound connections, so there is
# no Service. Keep one replica: the watchers are not sharded (jobs themselves are claimed with SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout-worker
  labels: {app: scout-worker, app.kubernetes.io/component: worker}
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"cfo-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"worker\")].image"}]'
spec:
  replicas: 1
  strategy: {type: Recreate}  # never two pollers at once during a rollout
  selector: {matchLabels: {app: scout-worker}}
  template:
    metadata: {labels: {app: scout-worker, app.kubernetes.io/component: worker}}
    spec:
      enableServiceLinks: false  # Service `api` would inject API_PORT=tcp://... and break the entrypoint
      volumes:
        - name: llm-ca
          configMap: {name: llm-service-ca}
        - name: data
          persistentVolumeClaim: {claimName: cfo-data}
      containers:
        - name: worker
          image: cfo-backend:latest
          args: [worker]
          volumeMounts:
            - {name: llm-ca, mountPath: /etc/llm-ca, readOnly: true}
            # Workstations and the demo mailbox (data/generated/...) written by the seed Job.
            - {name: data, mountPath: /app/data, readOnly: true}
          envFrom:
            - configMapRef: {name: cfo-config}
            - secretRef: {name: scout-onboarding, optional: true}  # same sealing key and OAuth app registration as API
            - secretRef: {name: slack, optional: true}   # SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_USER_MAP (created by the team, not in git)
          env:
            # DATABASE_URL is composed from the keys of Secret `postgres` (see deploy/postgres.yaml);
            # $(VAR) is expanded by Kubernetes, so these three must stay above it. If the password
            # contains URL-special characters (@ : / ?) percent-encode it or pick an alphanumeric one.
            - {name: POSTGRESQL_USER, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_USER}}}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_PASSWORD}}}
            - {name: POSTGRESQL_DATABASE, valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_DATABASE}}}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRESQL_USER):$(POSTGRESQL_PASSWORD)@postgres:5432/$(POSTGRESQL_DATABASE)
            # Bearer token of the NeMo check service (Secret scout-guardrails-client, key token, made by T051); optional:
            # without it Scout calls the service unauthenticated and, if that fails, fails open (D-029).
            - {name: GUARDRAILS_TOKEN, valueFrom: {secretKeyRef: {name: scout-guardrails-client, key: token, optional: true}}}
            # The liquidity model is trained on the first forecast review when the file is missing.
            - {name: FORECAST_MODEL_PATH, value: /tmp/liquidity_xgb.json}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
