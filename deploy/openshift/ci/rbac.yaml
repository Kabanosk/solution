# Identity of the GitHub Actions deploy workflow (.github/workflows/deploy.yml). Namespace-scoped `edit`: it can start
# builds, set images and apply the app/dashboard manifests, but cannot read cluster objects or change RBAC.
# Applied once by hand (not part of any kustomization):  oc apply -f deploy/openshift/ci/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  labels: {app.kubernetes.io/part-of: cfo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer-edit
  labels: {app.kubernetes.io/part-of: cfo}
subjects:
  - kind: ServiceAccount
    name: github-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
