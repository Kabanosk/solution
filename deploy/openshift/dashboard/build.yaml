apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: cfo-dashboard
spec:
  lookupPolicy: {local: true}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cfo-dashboard
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to: {kind: ImageStreamTag, name: "cfo-dashboard:latest"}
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}
  successfulBuildsHistoryLimit: 1   # each kept build keeps its Completed *-build pod (logs); older ones are pruned
  failedBuildsHistoryLimit: 2
