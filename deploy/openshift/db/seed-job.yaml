# One-shot seed: download the bank CSV from the file server, then `cfo migrate`, `cfo generate`, `cfo load --reset`.
# Idempotent: load --reset empties the tables first, generate is deterministic (seed 42).
# Re-seed: oc delete job cfo-seed && oc apply -k deploy/   (a Job spec is immutable, so delete it first).
# Needs: Secret `postgres` (deploy/postgres.yaml), PVC `cfo-data` and ImageStream `cfo-backend` (T023).
# WARNING: --reset wipes the simulator state too; do not re-run it during a live demo.
apiVersion: batch/v1
kind: Job
metadata:
  name: cfo-seed
  labels: {app: cfo-seed}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app: cfo-seed}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/cfo-agent-uwur/cfo-backend:latest
          imagePullPolicy: Always
          command: [python, -c]
          args:
            - |
              import os, shutil, subprocess, urllib.parse as up, urllib.request
              url = os.environ["SOURCE_CSV_URL"]
              urllib.request.urlretrieve(url, os.environ["SOURCE_CSV"])
              print("downloaded", url, flush=True)
              q = lambda k: up.quote(os.environ[k], safe="")
              os.environ["DATABASE_URL"] = (
                  f"postgresql://{q('POSTGRESQL_USER')}:{q('POSTGRESQL_PASSWORD')}"
                  f"@{os.environ['POSTGRES_HOST']}:5432/{q('POSTGRESQL_DATABASE')}"
              )
              shutil.rmtree("/app/data/generated", ignore_errors=True)
              for step in (
                  ["cfo", "migrate"],
                  ["cfo", "generate", "--out", "/app/data/generated"],
                  ["cfo", "load", "--data", "/app/data/generated", "--reset"],
              ):
                  print("+", *step, flush=True)
                  subprocess.run(step, check=True)
          env:
            - name: SOURCE_CSV_URL
              value: http://files:8080/pizzeria-amalfi-bank-statement-2025-v6.csv
            - name: SOURCE_CSV
              value: /tmp/bank-statement.csv
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRESQL_USER
              valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_USER}}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_PASSWORD}}
            - name: POSTGRESQL_DATABASE
              valueFrom: {secretKeyRef: {name: postgres, key: POSTGRESQL_DATABASE}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cfo-data}
