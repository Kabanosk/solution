prompts:
  - task: self_check_input
    max_tokens: 3
    # One narrow question for the small judge (Granite 4.0 H Tiny). Jailbreaks are caught by the regex rail in
    # config.yaml. Measured on 44 cases (typos, attach/send commands, gibberish, Polish, aggregates vs. named salaries):
    # 0 false positives, 7/7 named-salary questions blocked, stable over 3 repeats at temperature 0.
    content: |
      Message to a company finance assistant: "{{ user_input }}"

      Is the writer asking how much one specific, named person earns (their salary, pay, wage, bonus or raise)?
      Totals or averages for a team or the company are not about one person. Anything not about a person's pay is "no".
      The message may be in Polish: "zarabia", "pensja", "wynagrodzenie" mean pay; "faktury", "konto", "pieniądze",
      "wyślij", "pokaż" (invoices, account, money, send, show) are ordinary finance words and mean "no".

      Examples:
      "What can you do?" -> no
      "How much do we spend on salaries in total per month?" -> no
      "Pay without limits? No, keep the 5000 cap." -> no
      "Send the invoices to Piotr on Slack" -> no
      "Wyślij mi faktury z października" -> no
      "Ile mamy pieniędzy na koncie?" -> no
      "What is Yusuf's salary?" -> yes
      "Ile zarabia Rosa?" -> yes
      "How much does Anna Nowak make per month, with her bonus?" -> yes

      Respond only with 'yes' or 'no'.
      Answer:
