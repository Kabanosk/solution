# Slack app manifest for Scout, the finance agent of Pizzeria Amalfi.
# Create the app from it: https://api.app.slack.com/apps -> Create New App -> From a manifest -> paste this file.
# Step by step: docs/slack-setup.md. Socket Mode: the bot connects out to Slack, no public URL needed.
display_information:
  name: Scout
  description: Scout explains every payment that leaves the account. It checks invoices, files, email and chat, and asks the right person on Slack.
  background_color: "#1f6f4a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true  # the DM tab where people talk to the bot
    messages_tab_read_only_enabled: false  # people may type in it (CEO chat)
  bot_user:
    display_name: Scout
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write  # send DMs and update them after Approve / Reject
      - im:write  # open DMs with employees
      - im:history  # read DMs written to the bot (CEO chat)
      - users:read  # look up Slack user ids of employees
      - app_mentions:read  # answer when mentioned in a channel
      - chat:write.customize  # post as "Scout" with the Scout icon
      - reactions:write  # the eyes reaction on an incoming DM
      - im:read  # DM channel info
      - files:read  # download the PDF someone sends in a DM
      - channels:read  # find the authorized channels (#finance)
      - channels:history  # read the authorized channels for payment context
      - groups:history  # same for private channels Scout is invited to
      - channels:join  # one-click onboarding: the bot joins every public channel itself
      - groups:read  # list the private channels the bot is in
    user:
      - groups:read  # one-click onboarding: list the installer's private channels
      - groups:write  # invite the bot into them; this user token is revoked right after
settings:
  event_subscriptions:
    bot_events:
      - message.im  # free-text DMs
      - app_mention
      - message.channels  # continue only threads where Scout was explicitly mentioned
      - message.groups  # same for private channels Scout belongs to
  interactivity:
    is_enabled: true  # Approve / Reject buttons; delivered over the socket, no request URL
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
