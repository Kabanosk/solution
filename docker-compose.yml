services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: cfo, POSTGRES_PASSWORD: cfo, POSTGRES_DB: cfo}
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data/pizzeria-amalfi-bank-statement-2025-v6.csv:/tmp/statement.csv:ro
  files:
    build: ./files
    ports: ["8080:8080"]
    volumes: ["./data:/data:ro"]
