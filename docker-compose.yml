services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cfo
      POSTGRES_PASSWORD: cfo
      POSTGRES_DB: cfo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cfo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfo -d cfo"]
      interval: 2s
      timeout: 3s
      retries: 30
  files:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./data:/data:ro"]

volumes:
  cfo-db: