.dark { position: absolute; inset: 0; background: #000; }
.flick { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 90% at 30% 55%, transparent 40%, rgba(0,0,0,.55) 100%); pointer-events: none; }
.copy { position: absolute; right: 7%; top: 50%; transform: translateY(-50%); width: 42%; color: #fff; }
.eyebrow { font-size: clamp(11px, 1.2vw, 15px); color: #C9A86A; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; opacity: 0; }
.name { font-size: clamp(40px, 7.4vw, 96px); font-weight: 600; letter-spacing: -0.045em; line-height: 1; margin-top: 12px; opacity: 0; }
.tag { font-size: clamp(14px, 1.9vw, 24px); color: #B8BAC0; line-height: 1.4; margin-top: 16px; letter-spacing: -0.01em; opacity: 0; }
.tag b { color: #F5C66E; font-weight: 500; }
.ctl { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 8px; }
.ctl button { height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.4); color: #fff; font: 500 13px Inter, sans-serif; cursor: pointer; }
.ctl button:focus-visible { outline: 2px solid #F5B544; outline-offset: 2px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="photo" id="photo" role="img" aria-label="A hurricane lantern glowing on a dark desk, lighting up invoices, a receipt and a laptop."></div>
  <div class="vig"></div>
  <div class="dark" id="dark"></div>
  <div class="flick" id="flick"></div>
  <div class="copy">
    <div class="eyebrow" id="e">Autonomous CFO</div>
    <div class="name" id="n">Lantern</div>
    <div class="tag" id="t">Finds the answer to every payment, <b>wherever it's hiding</b>.</div>
  </div>
  <div class="ctl"><button type="button" id="replay">Replay</button></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const photo = $('photo'), dark = $('dark'), flick = $('flick'), e = $('e'), n = $('n'), t = $('t');
  const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FIX = new URLSearchParams(location.search).get('t');
  let t0 = performance.now();
  $('replay').onclick = () => { t0 = performance.now(); };
  function frame(now) {
    let s = FIX !== null ? +FIX : (now - t0) / 1000;
    if (reduce) s = 8;
    // 0–0.6s: black. 0.6–1.0: match strike (small flare). 1.0–3.2: light grows and reveals the desk.
    const strike = Math.max(0, 1 - Math.abs(s - 0.8) / 0.25);
    const light = ease((s - 0.9) / 2.3);
    dark.style.opacity = String(1 - light * 1.0);
    // flame flicker: layered sines, always on once lit
    const f = 0.82 + 0.1 * Math.sin(s * 11) + 0.06 * Math.sin(s * 23.7 + 1.3) + 0.04 * Math.sin(s * 5.1);
    const glowA = (light * f * 0.55 + strike * 0.9).toFixed(3);
    const r = 18 + 4 * f;
    flick.style.background = `radial-gradient(circle ${r}vw at 18.7% 56%, rgba(255,170,70,${glowA}), rgba(255,140,40,${(glowA * 0.25).toFixed(3)}) 45%, transparent 75%)`;
    // slow push-in
    const z = 1.06 - 0.06 * ease(s / 9);
    photo.style.transform = `scale(${z})`;
    e.style.opacity = String(ease((s - 3.0) / 0.7));
    n.style.opacity = String(ease((s - 3.3) / 0.8));
    n.style.transform = `translateY(${(1 - ease((s - 3.3) / 0.8)) * 14}px)`;
    t.style.opacity = String(ease((s - 3.9) / 0.8));
    if (FIX === null && !reduce && s > 11) t0 = now;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
