<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Scout — monochrome detective caps</title>
  <desc id="desc">Three original flat hat marks sit on the S in Scout. Tracker is a simplified deerstalker; Slant is a tilted flat cap; Fold is an angular cap. All three are shown as white-on-black and black-on-white app icons.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,sans-serif;fill:#17181B}
      .title{font-size:46px;font-weight:620;letter-spacing:-1.8px}
      .word{font-size:83px;font-weight:640;letter-spacing:-4px}
      .name{font-size:22px;font-weight:620;letter-spacing:-.45px}
      .muted{font-size:16px;fill:#565A64}
      .line{stroke:#DEE0E6}
    </style>
    <!-- A shallow twin-peaked deerstalker, viewed from the front. -->
    <symbol id="tracker" viewBox="0 0 64 40">
      <path fill="currentColor" fill-rule="evenodd" d="M10 24c2-9 9-16 19-18 2 0 3 1 3 2 0-1 1-2 3-2 10 2 17 9 19 18l4 2a2 2 0 0 1-1 4l-11 1-4 5c-1 2-3 2-4 0l-2-3a32 32 0 0 1-8 0l-2 3c-1 2-3 2-4 0l-4-5-11-1a2 2 0 0 1-1-4l4-2Zm10 2a30 30 0 0 0 24 0l-5-2a20 20 0 0 1-14 0l-5 2Z"/>
    </symbol>
    <!-- A low cloth cap, in side profile; the peak is deliberately one-sided. -->
    <symbol id="slant" viewBox="0 0 64 40">
      <path fill="currentColor" d="M8 27c2-7 8-14 18-17 10-4 21-2 27 3 4 4 3 7-1 10L35 33a40 40 0 0 1-25 2c-5-1-6-5-2-8Z"/>
      <path fill="currentColor" d="M35 34l17-9 8-1c2 0 3 2 1 3L46 35c-3 2-8 3-12 2-2 0-2-2 1-3Z"/>
    </symbol>
    <!-- The two planes of a folded cap; the diagonal seam is open space. -->
    <symbol id="fold" viewBox="0 0 64 40">
      <path fill="currentColor" d="M7 26 20 10a4 4 0 0 1 4-1l22 5-16 12H7Z"/>
      <path fill="currentColor" d="m34 28 16-12 10 9a1.8 1.8 0 0 1-.5 3l-18 7a6 6 0 0 1-3 .4L7 33a2 2 0 0 1 0-4l27-1Z"/>
    </symbol>
    <symbol id="light" viewBox="0 0 44 44"><rect x=".5" y=".5" width="43" height="43" rx="10" fill="#FFF" stroke="#DEE0E6"/></symbol>
    <symbol id="dark" viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#18191D"/></symbol>
  </defs>
  <rect width="1200" height="710" fill="#F8F9FB"/>
  <text class="title" x="64" y="91">Scout in monochrome</text>
  <text class="muted" x="66" y="126">Three original detective caps, worn by the wordmark.</text>
  <rect x="64.5" y="166.5" width="1071" height="455" rx="15" fill="#FFF" stroke="#DEE0E6"/>
  <path class="line" d="M421.5 167v454M778.5 167v454M65 450.5h1070" fill="none"/>
  <g transform="translate(64 167)" style="color:#17181B">
    <text class="word" x="79" y="184">Scout</text>
    <use href="#tracker" x="71" y="89" width="58" height="36"/>
    <text class="name" x="28" y="237">Tracker</text>
    <text class="muted" x="28" y="263">A deerstalker with two small ear flaps.</text>
    <use href="#light" x="28" y="321" width="44" height="44"/><use href="#tracker" x="35" y="334" width="30" height="18"/>
    <use href="#dark" x="83" y="321" width="44" height="44"/><use href="#tracker" x="90" y="334" width="30" height="18" style="color:#FFF"/>
    <text class="muted" x="28" y="402">Light and dark app icons</text>
  </g>
  <g transform="translate(421 167)" style="color:#17181B">
    <text class="word" x="79" y="184">Scout</text>
    <use href="#slant" x="67" y="88" width="64" height="40" transform="rotate(-9 99 110)"/>
    <text class="name" x="28" y="237">Slant</text>
    <text class="muted" x="28" y="263">A low flat cap, tipped to one side.</text>
    <use href="#light" x="28" y="321" width="44" height="44"/><use href="#slant" x="35" y="334" width="30" height="18" transform="rotate(-9 50 343)"/>
    <use href="#dark" x="83" y="321" width="44" height="44"/><use href="#slant" x="90" y="334" width="30" height="18" transform="rotate(-9 105 343)" style="color:#FFF"/>
    <text class="muted" x="28" y="402">Light and dark app icons</text>
  </g>
  <g transform="translate(778 167)" style="color:#17181B">
    <text class="word" x="79" y="184">Scout</text>
    <use href="#fold" x="71" y="89" width="60" height="38"/>
    <text class="name" x="28" y="237">Fold</text>
    <text class="muted" x="28" y="263">An angular cap cut into two shapes.</text>
    <use href="#light" x="28" y="321" width="44" height="44"/><use href="#fold" x="35" y="334" width="30" height="18"/>
    <use href="#dark" x="83" y="321" width="44" height="44"/><use href="#fold" x="90" y="334" width="30" height="18" style="color:#FFF"/>
    <text class="muted" x="28" y="402">Light and dark app icons</text>
  </g>
</svg>
