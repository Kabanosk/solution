<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Scout logo options</title>
  <desc id="desc">Four green Scout wordmarks, each shown with a full-size logo and a small app icon: Trail, Lookout, Relay, and Tree Frog.</desc>
  <defs>
    <symbol id="tile" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#203B2D"/></symbol>
    <symbol id="trail" viewBox="0 0 64 64">
      <path d="M46 17H28a8 8 0 0 0 0 16h8a8 8 0 0 1 0 16H20" fill="none" stroke="#E1F4BC" stroke-width="6" stroke-linecap="round"/>
      <circle cx="46" cy="17" r="5" fill="#A8D276"/><circle cx="20" cy="49" r="5" fill="#E1F4BC"/>
    </symbol>
    <symbol id="lookout" viewBox="0 0 64 64">
      <path d="M12 34c6-9 12-14 20-14s14 5 20 14c-6 9-12 14-20 14s-14-5-20-14Z" fill="#E1F4BC"/>
      <circle cx="32" cy="34" r="8" fill="#203B2D"/>
      <path d="m43 13 2.6 5.4L51 21l-5.4 2.6L43 29l-2.6-5.4L35 21l5.4-2.6Z" fill="#A8D276" stroke="#203B2D" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="relay" viewBox="0 0 64 64">
      <path d="M13 25h8l6-10 9 17h8m-31 7h8l6 10 9-17h8" fill="none" stroke="#E1F4BC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m43 24 9 8-9 8" fill="none" stroke="#A8D276" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="frog" viewBox="0 0 64 64">
      <path d="M10 30a10 10 0 0 1 19-8h6a10 10 0 0 1 19 8c3 3 5 6 5 10 0 10-12 15-27 15S5 50 5 40c0-4 2-7 5-10Z" fill="#E1F4BC"/>
      <circle cx="20" cy="28" r="3.6" fill="#203B2D"/><circle cx="44" cy="28" r="3.6" fill="#203B2D"/>
      <path d="M26 42q6 5 12 0" fill="none" stroke="#203B2D" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <style>
      text{font-family:system-ui,-apple-system,sans-serif;fill:#203B2D}
      .title{font-size:51px;font-weight:620;letter-spacing:-2.6px}
      .word{font-size:76px;font-weight:650;letter-spacing:-4.8px}
      .label{font-size:22px;font-weight:650;letter-spacing:-.5px}
      .detail{font-size:17px;fill:#496252}
    </style>
  </defs>
  <rect width="1200" height="750" fill="#F6F8F0"/>
  <text class="title" x="64" y="91">Scout logo options</text>
  <text class="detail" x="66" y="126">Four marks shown as a title lockup and a small app icon.</text>
  <path d="M64 160h1072M600 160v525M64 422h1072M64 685h1072" fill="none" stroke="#C9D5C5"/>
  <g transform="translate(66 160)">
    <use href="#tile" x="0" y="52" width="86" height="86"/><use href="#trail" x="0" y="52" width="86" height="86"/>
    <text class="word" x="108" y="121">Scout</text>
    <use href="#tile" x="450" y="82" width="26" height="26"/><use href="#trail" x="450" y="82" width="26" height="26"/>
    <text class="label" x="1" y="185">Trail</text>
    <text class="detail" x="1" y="214">An S-shaped path with a start and a finish.</text>
  </g>
  <g transform="translate(648 160)">
    <use href="#tile" x="0" y="52" width="86" height="86"/><use href="#lookout" x="0" y="52" width="86" height="86"/>
    <text class="word" x="108" y="121">Scout</text>
    <use href="#tile" x="450" y="82" width="26" height="26"/><use href="#lookout" x="450" y="82" width="26" height="26"/>
    <text class="label" x="1" y="185">Lookout</text>
    <text class="detail" x="1" y="214">An eye catching a signal others might miss.</text>
  </g>
  <g transform="translate(66 422)">
    <use href="#tile" x="0" y="52" width="86" height="86"/><use href="#relay" x="0" y="52" width="86" height="86"/>
    <text class="word" x="108" y="121">Scout</text>
    <use href="#tile" x="450" y="82" width="26" height="26"/><use href="#relay" x="450" y="82" width="26" height="26"/>
    <text class="label" x="1" y="185">Relay</text>
    <text class="detail" x="1" y="214">Two signals converge into one next step.</text>
  </g>
  <g transform="translate(648 422)">
    <use href="#tile" x="0" y="52" width="86" height="86"/><use href="#frog" x="0" y="52" width="86" height="86"/>
    <text class="word" x="108" y="121">Scout</text>
    <use href="#tile" x="450" y="82" width="26" height="26"/><use href="#frog" x="450" y="82" width="26" height="26"/>
    <text class="label" x="1" y="185">Tree Frog</text>
    <text class="detail" x="1" y="214">The mascot from the animated opening.</text>
  </g>
</svg>
