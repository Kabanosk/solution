[package]
name = "reference-api"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `reference-api`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "reference-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
scout-platform = { path = "../platform" }
serde_json = { version = "1", features = ["preserve_order"] }
scout-api = { path = "../scout-api" }
scout-finance-api = { path = "../finance-api" }
scout-config = { path = "../config" }
chrono = "0.4"
speedate = "0.18"
strum = "0.28"
percent-encoding = "2"
form_urlencoded = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
scout-system = { path = "../system" }

[workspace]
