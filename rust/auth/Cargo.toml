[package]
name = "scout-auth-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `bindings.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
futures = "0.3"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth", "raw_value"] }
serde_bytes = "0.11"
sha2 = "0.10"
scrypt = { version = "0.12", default-features = false }
subtle = "2.6"
url = "2.5"
base64 = "0.22"
getrandom = "0.4"
hex = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
