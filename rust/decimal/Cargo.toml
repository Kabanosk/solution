[package]
name = "scout-decimal"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
path = "../finance-api/src/decimal.rs"

[dependencies]
bigdecimal = "0.4.11"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
