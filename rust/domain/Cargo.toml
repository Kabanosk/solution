[package]
name = "scout-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "0.1"
indexmap = "2"
bigdecimal = { version = "0.4.11", features = ["serde-json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
scout-decimal = { path = "../decimal" }
