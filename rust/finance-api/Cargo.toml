[package]
name = "scout-finance-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
scout-decimal = { path = "../decimal" }
bigdecimal = "0.4.11"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
scout-platform = { path = "../platform" }
scout-api = { path = "../scout-api" }
scout-forecast-kernel = { path = "../forecast-kernel" }
scout-forecast-model-native = { path = "../forecast-model-native" }
scout-forecast-training-native = { path = "../forecast-training-native" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
