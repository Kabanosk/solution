[package]
name = "scout-finance-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `bindings.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
num-bigint = "0.5"
num-traits = "0.2"
icu_collator = "2.4"
icu_locale = "2.4"
ryu-js = "1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
