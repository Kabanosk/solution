[package]
name="scout-guardrails"
version="0.1.0"
edition="2024"
publish=false
[dependencies]
anyhow="1"
async-trait="0.1"
chrono={version="0.4",features=["serde"]}
regex="1"
reqwest={version="0.12",features=["json"]}
scout-domain={path="../domain"}
scout-platform={path="../platform"}
scout-llm={path="../llm"}
serde_json={version="1",features=["preserve_order"]}
sha1="0.10"
tokio={version="1",features=["sync","rt","time","macros"]}
tokio-postgres="0.7"
uuid="1"
[lints.rust]
unsafe_code="forbid"
