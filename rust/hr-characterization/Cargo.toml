[package]
name = "scout-hr-characterization"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `contract/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

async-trait="0.1"
chrono="0.4"
serde_json={version="1",features=["preserve_order","float_roundtrip"]}
scout-domain={path="../domain"}
scout-platform={path="../platform"}
scout-api={path="../scout-api"}
tokio-postgres={version="0.7",features=["with-chrono-0_4"]}
tokio={version="1",features=["rt","net","time"]}

[features]
default=["characterization"]
characterization=[]

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
