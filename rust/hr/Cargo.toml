[package]
name="scout-hr"
version="0.1.0"
edition="2024"
rust-version="1.97"
publish=false

[lib]
path="../hr-characterization/src/port/native.rs"

[features]
characterization=[]

[dependencies]
async-trait="0.1"
chrono="0.4"
serde_json={version="1",features=["preserve_order","float_roundtrip"]}
scout-domain={path="../domain"}
scout-platform={path="../platform"}
scout-api={path="../scout-api"}
tokio-postgres={version="0.7",features=["with-chrono-0_4"]}
tokio={version="1",features=["rt","net","time"]}

[dev-dependencies]
scout-audit={path="../audit"}
uuid={version="1",features=["v4"]}
tokio={version="1",features=["rt-multi-thread","macros"]}
