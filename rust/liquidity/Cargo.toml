[package]
name = "scout-liquidity"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `contract/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = "0.4"
bigdecimal = "0.4.11"
num-traits = "0.2"
scout-decimal = { path = "../decimal" }
scout-policy-core = { path = "../policy-core" }
scout-forecast-kernel = { path = "../forecast-kernel" }
scout-forecast-model-native = { path = "../forecast-model-native" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
