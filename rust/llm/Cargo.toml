[package]
name="scout-llm"
version="0.1.0"
edition="2024"
publish=false

[dependencies]
anyhow="1"
async-trait="0.1"
chrono={version="0.4",features=["serde"]}
getrandom="0.3"
httpdate="1"
reqwest={version="0.12",default-features=false,features=["json","rustls-tls-native-roots"]}
ryu="1"
scout-platform={path="../platform"}
serde={version="1",features=["derive"]}
serde_json={version="1",features=["preserve_order","float_roundtrip","arbitrary_precision"]}
tokio={version="1",features=["sync","time","macros","rt-multi-thread"]}
tracing="0.1"

[lints.rust]
unsafe_code="forbid"
[lints.clippy]
all={level="warn",priority=-1}
