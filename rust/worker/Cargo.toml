[package]
name="scout-worker"
version="0.1.0"
edition="2024"
rust-version="1.97"
publish=false

[dependencies]
anyhow="1"
async-trait="0.1"
chrono={version="0.4",features=["serde"]}
scout-domain={path="../domain"}
scout-platform={path="../platform"}
scout-audit={path="../audit"}
scout-hr={path="../hr"}
scout-jobs={path="../jobs"}
scout-tasks={path="../tasks"}
scout-config={path="../config"}
scout-llm={path="../llm"}
scout-liquidity-native={path="../liquidity-native"}
serde_json={version="1",features=["preserve_order","float_roundtrip"]}
tokio={version="1",features=["rt-multi-thread","sync","macros","time"]}
tracing="0.1"
